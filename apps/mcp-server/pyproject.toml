[project]
name = "mcp-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp-core",
  "mcp-hello",
  "mcp-geo",
]

[project.scripts]
mcp-server = "mcp_app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_app"]

[tool.uv.sources]
mcp-core = { workspace = true }
mcp-hello = { workspace = true }
mcp-geo = { workspace = true }
