[project]
name = "mcp-platform"
version = "0.1.0"
description = "Public modular MCP platform (mcp.glc-reg.hu)"
requires-python = ">=3.11"
dependencies = [
  "mcp-core",
  "mcp-hello",
  "mcp-geo",
  "mcp-app",
]

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/hello",
  "packages/geo",
  "apps/mcp-server",
]

[tool.uv.sources]
mcp-core = { workspace = true }
mcp-hello = { workspace = true }
mcp-geo = { workspace = true }
mcp-app = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
