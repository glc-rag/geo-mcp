# mcp.glc-rag.hu -> MCP platform :8780
server {
    server_name mcp.glc-rag.hu;

    client_max_body_size 32M;

    location ^~ /.well-known/acme-challenge/ {
        root /home/pergel/mcp/public;
        default_type "text/plain";
        allow all;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/mcp.glc-rag.hu-access.log;
    error_log  /var/log/nginx/mcp.glc-rag.hu-error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mcp.glc-rag.hu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mcp.glc-rag.hu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = mcp.glc-rag.hu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name mcp.glc-rag.hu;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}