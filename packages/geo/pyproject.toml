[project]
name = "mcp-geo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp-core", "asyncpg>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_geo"]

[tool.uv.sources]
mcp-core = { workspace = true }
